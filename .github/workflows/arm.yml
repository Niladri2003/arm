name: Debug Windows ARM64 via Pinggy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  debug:
    runs-on: windows-11-arm
    timeout-minutes: 350   # just under the 6-hour hard cap

    steps:
      - name: Set password for runneradmin
        shell: powershell
        run: net user runneradmin "${{ secrets.SSH_PASSWORD }}"

      - name: Install OpenSSH Server (fast — direct download)
        shell: powershell
        run: |
          $svc = Get-Service sshd -ErrorAction SilentlyContinue
          if (-not $svc) {
            $url = "https://github.com/PowerShell/Win32-OpenSSH/releases/download/v9.8.3.0p2-Preview/OpenSSH-ARM64.zip"
            $zip = "$env:TEMP\OpenSSH-ARM64.zip"

            Write-Host "Downloading OpenSSH ARM64 (~5 MB)..."
            $ProgressPreference = 'SilentlyContinue'   # huge speedup for Invoke-WebRequest
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing

            Write-Host "Extracting..."
            Expand-Archive -Path $zip -DestinationPath "C:\Program Files" -Force
            Rename-Item "C:\Program Files\OpenSSH-ARM64" "C:\Program Files\OpenSSH" -ErrorAction SilentlyContinue

            Write-Host "Registering sshd service..."
            powershell.exe -ExecutionPolicy Bypass -File "C:\Program Files\OpenSSH\install-sshd.ps1"

            Remove-Item $zip -Force
          } else {
            Write-Host "sshd already present, skipping install."
          }

          Set-Service -Name sshd -StartupType Automatic
          Start-Service sshd

          # Enable password auth
          $cfg = "C:\ProgramData\ssh\sshd_config"
          (Get-Content $cfg) `
            -replace '#?PasswordAuthentication.*','PasswordAuthentication yes' |
            Set-Content $cfg
          Restart-Service sshd

          # Allow inbound on port 22
          New-NetFirewallRule -Name sshd -DisplayName 'OpenSSH-Server-In-TCP' `
            -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22 `
            -ErrorAction SilentlyContinue | Out-Null

          Get-Service sshd

      
      - name: Start Pinggy in remote-management mode
        shell: powershell
        timeout-minutes: 345
        env:
          PINGGY_API_KEY: ${{ secrets.PINGGY_API_KEY }}
        run: |
          # Install Pinggy CLI globally via npm.
          npm install -g pinggy

          # Run the agent in remote-management mode. This is a long-lived
          # foreground process; tunnels are created on-demand from the
          # Pinggy dashboard (https://dashboard.pinggy.io/activedevices),
          # so nothing tunnel-related is logged here.
          Write-Host "Starting Pinggy remote-management agent. Open tunnels from the Pinggy dashboard."
          pinggy --remote-management $env:PINGGY_API_KEY
          Write-Host "Pinggy agent exited."

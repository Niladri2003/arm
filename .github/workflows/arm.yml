name: Debug Windows ARM64 via Pinggy

on:
   push:
      branches: [main]
   workflow_dispatch:
  

jobs:
  debug:
    runs-on: windows-11-arm
    timeout-minutes: 350   # just under the 6-hour hard cap

    steps:
      - name: Set password for runneradmin
        shell: powershell
        run: net user runneradmin "${{ secrets.SSH_PASSWORD }}"

      - name: Enable OpenSSH Server
        shell: powershell
        run: |
          $svc = Get-Service sshd -ErrorAction SilentlyContinue
          if (-not $svc) {
            Write-Host "sshd not present, installing Windows capability..."
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          } else {
            Write-Host "sshd already present: $($svc.StartType) / $($svc.Status)"
          }

          Set-Service -Name sshd -StartupType Automatic
          Start-Service sshd

          (Get-Content "C:\ProgramData\ssh\sshd_config") `
            -replace '#?PasswordAuthentication.*','PasswordAuthentication yes' |
            Set-Content "C:\ProgramData\ssh\sshd_config"
          Restart-Service sshd

          New-NetFirewallRule -Name sshd -DisplayName 'OpenSSH-Server-In-TCP' `
            -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22 `
            -ErrorAction SilentlyContinue | Out-Null

          Get-Service sshd

      - name: Install Pinggy CLI
        shell: powershell
        run: |
          npm install -g pinggy
          pinggy --version

      - name: Start Pinggy TCP tunnel for SSH
        shell: powershell
        run: |
          $token = "${{ secrets.PINGGY_TOKEN }}"
          $user  = if ($token) { "$token+tcp@a.pinggy.io" } else { "tcp@a.pinggy.io" }

          Start-Process -FilePath "pinggy" -NoNewWindow `
            -ArgumentList @("-R0:localhost:22", $user) `
            -RedirectStandardOutput pinggy.out `
            -RedirectStandardError  pinggy.err

          # Wait up to ~60 s for the URL to appear in the CLI stdout
          $url = $null
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            $content = Get-Content pinggy.out -Raw -ErrorAction SilentlyContinue
            if ($content -match 'tcp://([^\s]+)') {
              $url = $matches[1]
              break
            }
          }

          Write-Host "==================== PINGGY URL ===================="
          if ($url) {
            $parts = $url.Split(':')
            Write-Host "Public address : $url"
            Write-Host ""
            Write-Host "Connect from your laptop:"
            Write-Host "  ssh runneradmin@$($parts[0]) -p $($parts[1])"
            Write-Host ""
            Write-Host "Password: the SSH_PASSWORD secret you set."
          } else {
            Write-Host "No URL detected. Raw output:"
            Get-Content pinggy.out -ErrorAction SilentlyContinue
            Write-Host "--- stderr ---"
            Get-Content pinggy.err -ErrorAction SilentlyContinue
          }
          Write-Host "===================================================="

      - name: Hold the runner open
        shell: powershell
        run: Start-Sleep -Seconds 20700   # ~5 h 45 m

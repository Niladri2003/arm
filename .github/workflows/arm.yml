name: Debug Windows ARM64 via Pinggy

on:
   push:
      branches: [main]
   workflow_dispatch:
  

jobs:
  debug:
    runs-on: windows-11-arm
    timeout-minutes: 350
    steps:
      - name: Set password for runneradmin
        shell: powershell
        run: net user runneradmin "${{ secrets.SSH_PASSWORD }}"

      - name: Enable OpenSSH Server
        shell: powershell
        run: |
          $svc = Get-Service sshd -ErrorAction SilentlyContinue
          if (-not $svc) {
            Write-Host "sshd service not present, installing capability (slow)..."
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          } else {
            Write-Host "sshd service already present: StartType=$($svc.StartType), Status=$($svc.Status)"
          }

          Set-Service -Name sshd -StartupType Automatic
          Start-Service sshd

          (Get-Content "C:\ProgramData\ssh\sshd_config") `
            -replace '#?PasswordAuthentication.*','PasswordAuthentication yes' |
            Set-Content "C:\ProgramData\ssh\sshd_config"
          Restart-Service sshd

          New-NetFirewallRule -Name sshd -DisplayName 'OpenSSH-Server-In-TCP' `
            -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22 `
            -ErrorAction SilentlyContinue

          Get-Service sshd
          Get-NetTCPConnection -LocalPort 22 -ErrorAction SilentlyContinue

      - name: Start Pinggy TCP tunnel
        shell: powershell
        run: |
          $token = "${{ secrets.PINGGY_TOKEN }}"
          $user  = if ($token) { "$token+tcp" } else { "tcp" }

          Start-Process -FilePath "ssh" -NoNewWindow `
            -ArgumentList @(
              "-o","StrictHostKeyChecking=no",
              "-o","ServerAliveInterval=30",
              "-o","ExitOnForwardFailure=yes",
              "-p","443",
              "-R0:localhost:22",
              "$user@a.pinggy.io"
            ) `
            -RedirectStandardOutput pinggy.out `
            -RedirectStandardError  pinggy.err

          Start-Sleep -Seconds 12
          Write-Host "==================== PINGGY URL ===================="
          Get-Content pinggy.out -ErrorAction SilentlyContinue
          Get-Content pinggy.err -ErrorAction SilentlyContinue
          Write-Host "===================================================="
          Write-Host "Connect from your laptop:"
          Write-Host "  ssh runneradmin@<host> -p <port>"
          Write-Host "(username: runneradmin, password: the one you set)"

      - name: Hold the runner open
        shell: powershell
        run: Start-Sleep -Seconds 20700  # ~5h 45m
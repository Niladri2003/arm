name: Debug Windows ARM64 via Pinggy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  debug:
    runs-on: windows-11-arm
    timeout-minutes: 350   # just under the 6-hour hard cap

    steps:
      - name: Set password for runneradmin
        shell: powershell
        run: net user runneradmin "${{ secrets.SSH_PASSWORD }}"

      - name: Install OpenSSH Server (fast — direct download)
        shell: powershell
        run: |
          $svc = Get-Service sshd -ErrorAction SilentlyContinue
          if (-not $svc) {
            $url = "https://github.com/PowerShell/Win32-OpenSSH/releases/download/v9.8.3.0p2-Preview/OpenSSH-ARM64.zip"
            $zip = "$env:TEMP\OpenSSH-ARM64.zip"

            Write-Host "Downloading OpenSSH ARM64 (~5 MB)..."
            $ProgressPreference = 'SilentlyContinue'   # huge speedup for Invoke-WebRequest
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing

            Write-Host "Extracting..."
            Expand-Archive -Path $zip -DestinationPath "C:\Program Files" -Force
            Rename-Item "C:\Program Files\OpenSSH-ARM64" "C:\Program Files\OpenSSH" -ErrorAction SilentlyContinue

            Write-Host "Registering sshd service..."
            powershell.exe -ExecutionPolicy Bypass -File "C:\Program Files\OpenSSH\install-sshd.ps1"

            Remove-Item $zip -Force
          } else {
            Write-Host "sshd already present, skipping install."
          }

          Set-Service -Name sshd -StartupType Automatic
          Start-Service sshd

          # Enable password auth
          $cfg = "C:\ProgramData\ssh\sshd_config"
          (Get-Content $cfg) `
            -replace '#?PasswordAuthentication.*','PasswordAuthentication yes' |
            Set-Content $cfg
          Restart-Service sshd

          # Allow inbound on port 22
          New-NetFirewallRule -Name sshd -DisplayName 'OpenSSH-Server-In-TCP' `
            -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22 `
            -ErrorAction SilentlyContinue | Out-Null

          Get-Service sshd

      - name: Start Pinggy TCP tunnel for SSH
        shell: powershell
        run: |
          $token = "${{ secrets.PINGGY_TOKEN }}"
          $user  = if ($token) { "$token+tcp" } else { "tcp" }

          # -tt forces PTY allocation so Pinggy prints the URL banner even when
          # stdin is redirected to NUL.
          Start-Process -FilePath "ssh" -NoNewWindow `
            -ArgumentList @(
              "-tt",
              "-o","StrictHostKeyChecking=no",
              "-o","UserKnownHostsFile=NUL",
              "-o","ServerAliveInterval=30",
              "-o","ExitOnForwardFailure=yes",
              "-p","443",
              "-R","0:localhost:22",
              "$user@a.pinggy.io"
            ) `
            -RedirectStandardInput  NUL `
            -RedirectStandardOutput pinggy.out `
            -RedirectStandardError  pinggy.err

          # Poll the log file for the tunnel URL (Pinggy can take 20-30s)
          $url = $null
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            $content = Get-Content pinggy.out -Raw -ErrorAction SilentlyContinue
            if ($content -match 'tcp://([^\s]+\.pinggy\.[a-z]+:\d+)') {
              $url = $matches[1]
              break
            }
          }

          Write-Host "==================== PINGGY URL ===================="
          if ($url) {
            $parts = $url.Split(':')
            Write-Host "Public address : $url"
            Write-Host ""
            Write-Host "Connect from your laptop:"
            Write-Host "  ssh runneradmin@$($parts[0]) -p $($parts[1])"
            Write-Host ""
            Write-Host "Password: the SSH_PASSWORD secret you set."
          } else {
            Write-Host "No URL detected after 60s. Raw output below:"
            Write-Host "--- stdout ---"
            Get-Content pinggy.out -ErrorAction SilentlyContinue
            Write-Host "--- stderr ---"
            Get-Content pinggy.err -ErrorAction SilentlyContinue
          }
          Write-Host "===================================================="

      - name: Hold the runner open
        shell: powershell
        run: Start-Sleep -Seconds 20700   # ~5 h 45 m
